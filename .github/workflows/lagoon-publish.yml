# The demo app's lagoon, published to the lagoon host on every push to main.
#
# WHY THIS EXISTS. The host's `latest` URL only changes when someone runs `motu lagoon publish
# --remote`, and that was a step people forgot: twice the hosted lagoon showed a build an hour behind
# `main` — a redesigned region looking unredesigned — while every check was green. Pushing is the
# moment the code becomes the code, so it is the moment the preview should follow it.
#
# WHAT IT PUBLISHES. The same self-contained page `motu lagoon publish` builds locally: every region
# and island of demo-app, on mock fixtures, keyed by content so a republish of identical bytes is
# deduplicated by the host. `latest` moves; the immutable per-build URL is printed in the job log.
#
# ONE-TIME SETUP, outside this file — two repository secrets:
#   MOTU_HOST_URL    the host's base URL, e.g. https://motu.bulgarelli.dev
#   MOTU_HOST_TOKEN  a token the host accepts for publishing (the one in ~/.config/motu/host.json)
# Without them the job says so and stops, rather than failing on a missing variable.
name: lagoon-publish

on:
  push:
    branches: [main]
    paths:
      - 'demo-app/**'
      - 'packages/**'
      - 'motu.config.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lagoon-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a newer push supersedes a queued one: `latest` should end on the newest
# build, and two uploads racing could end on the older.
concurrency:
  group: lagoon-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Host configured?
        env:
          MOTU_HOST_URL: ${{ secrets.MOTU_HOST_URL }}
          MOTU_HOST_TOKEN: ${{ secrets.MOTU_HOST_TOKEN }}
        run: |
          if [ -z "$MOTU_HOST_URL" ] || [ -z "$MOTU_HOST_TOKEN" ]; then
            echo "::error::Set the MOTU_HOST_URL and MOTU_HOST_TOKEN repository secrets to publish the lagoon."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Before setup-node: `cache: pnpm` needs the binary to exist (same reason as verify.yml).
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every @motujs/* package resolves through ./dist, which is gitignored.
      - run: node scripts/build-packages.mjs

      # From the repo root, where motu.config.json names the app and `publishAs` names the repo the host
      # files it under. The token never appears in the log: it is passed through the environment.
      - name: Publish the lagoon
        env:
          MOTU_HOST_URL: ${{ secrets.MOTU_HOST_URL }}
          MOTU_HOST_TOKEN: ${{ secrets.MOTU_HOST_TOKEN }}
        run: node packages/cli/src/cli.mjs lagoon publish --remote
