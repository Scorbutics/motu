# The lagoon host's identity, and nothing else.
#
# TWO CONTAINERS, NOT EIGHT. docs/plan-lagoon-host.md argues this at length and the short version is:
# the only component that justifies the stack is GoTrue. Storage would create a second source of
# truth for what exists and silently discard store.mjs's retention rule; PostgREST generates a REST
# API this app does not want, because a Next app talks to Postgres directly; Realtime has nothing to
# be live about; and pooling solves a problem that serving static HTML does not have.
#
# NOT the machine's other Supabase stack. peps runs a full `supabase start` on 54321-54327, and these
# ports are chosen to sit clear of it — two projects on one laptop must not share a database, and a
# port collision here would look like an auth bug for an afternoon.
#
#   docker compose -f host-app/infra/docker-compose.yml up -d
#   docker compose -f host-app/infra/docker-compose.yml down     (add -v to drop the data)
services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.063
    container_name: motu_host_db
    restart: unless-stopped
    ports:
      # LOOPBACK ONLY, like the node host it sits beside. Nothing outside this machine has business
      # reaching the database directly; the app is the only client, and it is on the same box.
      - '127.0.0.1:54342:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: motu_host
    volumes:
      - motu_host_db:/var/lib/postgresql/data
      # Applied in filename order on FIRST boot of an empty volume. It is not a migration runner —
      # `infra/apply-migrations.sh` is what re-applies them to a database that already exists, and the
      # two read the same files so they cannot describe different schemas.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d motu_host']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.187.0
    container_name: motu_host_auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:9998:9999'
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${MOTU_HOST_PUBLIC_URL:-http://127.0.0.1:8817}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      # `?search_path=auth` IS REQUIRED, not decoration. GoTrue's migrator creates its own
      # `schema_migrations` table wherever the search path points, and without this that is `public` —
      # which `supabase_auth_admin` may use but not write to, so the container boot-loops on
      # "permission denied for schema public" and never creates auth.users at all.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/motu_host?search_path=auth
      GOTRUE_SITE_URL: ${MOTU_HOST_PUBLIC_URL:-http://127.0.0.1:8817}
      GOTRUE_URI_ALLOW_LIST: ${MOTU_HOST_PUBLIC_URL:-http://127.0.0.1:8817}/**
      GOTRUE_JWT_SECRET: ${MOTU_HOST_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # NO SIGNUP BY EMAIL AND NO MAILER. The plan's phase 1 chooses GitHub precisely to avoid running
      # mail for magic links, password resets and invitations — the annoying half of self-hosting
      # GoTrue, and a classic works-locally-breaks-in-prod. Leaving these on would quietly re-open the
      # door this decision closed.
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${MOTU_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${MOTU_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${MOTU_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${MOTU_HOST_PUBLIC_URL:-http://127.0.0.1:8817}/auth/v1/callback
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  motu_host_db:
